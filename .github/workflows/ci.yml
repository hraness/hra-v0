name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    name: Archive source gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Install exact dependencies
        run: bun install --frozen-lockfile
      - name: Verify archive policies and documentation
        run: |
          bun run check:standalone
          bun run check:agent-guides
          bun run check:structure
          bun run check:public-boundary
          bun run check:public-tree
          bun run brand-assets:check
          bun test ./scripts ./apps/web/app/landing.test.ts

  required:
    name: Required
    if: ${{ always() }}
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require archive source gate
        shell: bash
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          set -euo pipefail
          if [[ "$VERIFY_RESULT" != "success" ]]; then
            echo "::error::verify finished with $VERIFY_RESULT"
            exit 1
          fi
